<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <div class="calculadora">
    <h1 id="titulo">Calculadora</h1>
    <input type="text" id="visor">
    <div>
        <button class="btn" onclick="Inserir('1')">1</button>
        <button class="btn" onclick="Inserir('2')">2</button>
        <button class="btn" onclick="Inserir('3')">3</button>
    </div>
    <div>
        <button class="btn" onclick="Inserir('4')">4</button>
        <button class="btn" onclick="Inserir('5')">5</button>
        <button class="btn" onclick="Inserir('6')">6</button>
    </div>
    <div>
        <button class="btn" onclick="Inserir('7')">7</button>
        <button class="btn" onclick="Inserir('8')">8</button>
        <button class="btn" onclick="Inserir('9')">9</button>
    </div>
    <div>
        <button class="btn" onclick="Inserir('0')">0</button>
        <button class="btnOp" onclick="definirOperador('*')">x</button> 
        <button class="btnOp" onclick="definirOperador('/')">/</button>
    </div>
    <div>
        <button class="btnOp" onclick="definirOperador('+')">+</button>
        <button class="btnOp" onclick="definirOperador('-')">-</button>
        <button class="btnOp" onclick="calcular()">=</button>
    </div>
    <div>
        <button class="btnI" onclick="Clear()">Clear</button>
    </div>
    </div>
</head>
<body>
    <script src="script.js"></script>
</body>
</html>
